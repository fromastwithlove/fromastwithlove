design:
  theme: engineeringresumes
  page:
    size: a4
    top_margin: 1.2cm
    bottom_margin: 1.2cm
    left_margin: 1.5cm
    right_margin: 1.5cm
    show_footer: true
    show_top_note: true
  colors:
    body: rgb(0, 0, 0)
    footer: rgb(128, 128, 128)
    top_note: rgb(128, 128, 128)
  typography:
    line_spacing: 0.6em
    alignment: justified
    date_and_location_column_alignment: right
    font_size:
      body: 10pt
      name: 16pt
  links:
    underline: false
    show_external_link_icon: true
  header:
    alignment: center
    space_below_name: 0.5cm
    space_below_connections: 0.5cm
    connections:
      show_icons: true
      display_urls_instead_of_usernames: false
      space_between_connections: 0.5cm
  section_titles:
    type: with_partial_line
    line_thickness: 0.5pt
    space_above: 0.45cm
    space_below: 0.3cm
  sections:
    allow_page_break: true
    space_between_regular_entries: 0.3cm
  entries:
    date_and_location_width: 4.15cm
    space_between_columns: 0.1cm
    allow_page_break: true
    highlights:
      bullet: •
  templates:
    footer: '*NAME – PAGE_NUMBER/TOTAL_PAGES*'
    top_note: '*LAST_UPDATED CURRENT_DATE*'
    single_date: MONTH_ABBREVIATION YEAR
    education_entry:
      main_column: |-
        **INSTITUTION**, *DEGREE_WITH_AREA* -- LOCATION
        SUMMARY
        HIGHLIGHTS
